percent over its first two seconds, then split it where the
playhead is. Show me the timeline before and after each step.`,aj=`# Install the official Remotion skill for your coding agents

# Create a clean video project

npm run dev`,lj=`{
  "mcpServers": {
    "resolve-ai-bridge": {

      "args": ["/ABSOLUTE/PATH/TO/.resolve-ai-bridge/bridge/server.py"]
    }
